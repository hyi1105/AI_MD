<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Approval｜LINE 對話＋格式卡</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app" id="app">
    <nav class="rail" aria-label="主選單">
      <button class="rail-btn" title="活動" type="button">🔔</button>
      <button class="rail-btn active" title="聊天" type="button">💬</button>
      <button class="rail-btn" title="團隊" type="button">👥</button>
      <button class="rail-btn" title="行事曆" type="button">📅</button>
      <button class="rail-btn" title="通話" type="button">📞</button>
      <button class="rail-btn" title="檔案" type="button">📁</button>
      <div class="rail-spacer"></div>
      <button class="rail-btn avatar" title="我" type="button" id="me-rail">我</button>
    </nav>

    <aside class="sidebar">
      <header class="sidebar-head">
        <h1>聊天</h1>
        <span class="demo-pill">Demo</span>
      </header>
      <label class="search">
        <span class="sr-only">搜尋</span>
        <input type="search" placeholder="搜尋" disabled />
      </label>
      <ul class="chat-list">
        <li class="chat-item active">
          <span class="dot online"></span>
          <div>
            <strong>簽核｜請假申請</strong>
            <p>像打 LINE · 手上另有格式卡</p>
          </div>
        </li>
        <li class="chat-item">
          <span class="dot"></span>
          <div>
            <strong>人資公告</strong>
            <p>本週表單改版說明</p>
          </div>
        </li>
      </ul>
    </aside>

    <main class="main">
      <header class="main-head">
        <div>
          <h2>簽核｜請假申請</h2>
          <p class="sub" id="viewer-role">檢視中：申請人 · 聊天 ≠ 格式卡</p>
        </div>
        <div class="main-actions">
          <button type="button" class="ghost" id="btn-toggle-card" aria-controls="format-card" aria-expanded="true">收起格式卡</button>
          <button type="button" class="ghost" id="btn-as-approver">切成簽核人視角</button>
        </div>
      </header>

      <div class="stage">
        <!-- 主錨：LINE 風對話（一般聊天） -->
        <section class="thread" aria-label="對話室">
          <div class="thread-banner">
            <strong>一般聊天</strong>
            <span>像打 LINE · 不是填表</span>
          </div>
          <div class="boxes" id="boxes"></div>
          <form class="composer" id="composer">
            <input type="text" id="msg" placeholder="輸入聊天訊息…" autocomplete="off" />
            <button type="submit" class="primary">傳送</button>
          </form>
        </section>

        <!-- 另一個東西：手上的格式卡（文件） -->
        <aside class="format-card" id="format-card" aria-label="格式卡（手上文件）">
          <div class="card-top">
            <div>
              <p class="card-kicker">手上文件 · 格式卡</p>
              <h3 class="card-title">請假申請單</h3>
            </div>
            <button type="button" class="ghost card-close" id="btn-close-card" aria-label="收起格式卡">收起</button>
          </div>
          <p class="card-meta">leave_request_v1 · 必填未完成不可送出</p>
          <p class="card-missing hidden" id="card-missing" role="status"></p>

          <form class="card-form" id="card-form">
            <label class="field">
              <span class="label">申請人</span>
              <input type="text" name="applicant" value="王小明" readonly data-required="true" />
            </label>
            <label class="field">
              <span class="label">假別 <em>必填</em></span>
              <select name="leave_type" data-required="true">
                <option value="">請選擇</option>
                <option value="特休">特休</option>
                <option value="事假" selected>事假</option>
                <option value="病假">病假</option>
                <option value="其他">其他</option>
              </select>
            </label>
            <label class="field">
              <span class="label">天數 <em>必填</em></span>
              <input type="number" name="days" value="1" min="0.5" step="0.5" data-required="true" />
            </label>
            <label class="field">
              <span class="label">是否需代理人</span>
              <select name="need_agent">
                <option value="否">否</option>
                <option value="是" selected>是</option>
              </select>
            </label>
            <label class="field">
              <span class="label">代理人</span>
              <input type="text" name="agent" value="陳美玲" />
            </label>
            <label class="field personal" id="private-field">
              <span class="label">僅自己可見備註 <em>personal</em></span>
              <input type="text" name="private_note" value="醫生回診（別人看不到這格）" />
            </label>
          </form>

          <div class="waterline" aria-label="簽名流水線">
            <p class="waterline-caption">簽名流水線（點人名）</p>
            <ol class="nodes" id="sign-nodes">
              <li class="node done" data-role="applicant">
                <button type="button" class="node-btn" data-action="self">
                  <span class="avatar-sm">王</span>
                  <span class="name">王小明</span>
                  <span class="role">申請人</span>
                </button>
              </li>
              <li class="pipe" aria-hidden="true"></li>
              <li class="node" data-role="agent">
                <button type="button" class="node-btn" data-action="agent">
                  <span class="avatar-sm">陳</span>
                  <span class="name">陳美玲</span>
                  <span class="role">代理人</span>
                </button>
              </li>
              <li class="pipe" aria-hidden="true"></li>
              <li class="node current" data-role="approver">
                <button type="button" class="node-btn" data-action="approver">
                  <span class="avatar-sm">林</span>
                  <span class="name">林主管</span>
                  <span class="role">簽核人</span>
                </button>
              </li>
            </ol>
          </div>

          <div class="btn-row" id="card-actions">
            <button type="button" class="primary" id="btn-primary-action">送出申請</button>
          </div>
        </aside>
      </div>
    </main>
  </div>

  <div class="sheet hidden" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-card">
      <h3 id="sheet-title">操作</h3>
      <p id="sheet-desc"></p>
      <ul id="sheet-actions"></ul>
      <button type="button" class="ghost" id="sheet-close">關閉</button>
    </div>
  </div>

  <div class="sheet hidden" id="profile" role="dialog" aria-modal="true">
    <div class="sheet-card">
      <h3 id="profile-title">個人資料</h3>
      <dl id="profile-body"></dl>
      <button type="button" class="ghost" id="profile-close">關閉</button>
    </div>
  </div>

  <div class="sheet hidden" id="reason-sheet" role="dialog" aria-modal="true">
    <div class="sheet-card">
      <h3 id="reason-title">請填理由</h3>
      <p id="reason-desc"></p>
      <label class="reason-field">
        <span class="sr-only">理由</span>
        <textarea id="reason-input" rows="3" placeholder="輸入理由…"></textarea>
      </label>
      <div class="btn-row">
        <button type="button" class="primary" id="reason-confirm">確認</button>
        <button type="button" class="ghost" id="reason-cancel">取消</button>
      </div>
    </div>
  </div>

  <!-- 收合後固定可點：避免被底層擋住 -->
  <button type="button" class="card-reopen hidden" id="btn-reopen-card" aria-controls="format-card">
    打開格式卡
  </button>

  <div class="toast hidden" id="toast" role="status"></div>
  <p class="demo-foot">
    <a href="../">← SEED 首頁</a>
    ·
    <a href="../schema/form-schema.example.json">表單 schema 範例</a>
  </p>
  <script src="./app.js"></script>
</body>
</html>
