<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工具詳情 — SEED</title>
  <script>
    (function () {
      try {
        var theme = localStorage.getItem("ai_md_theme");
        if (theme === "dark" || (!theme && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      } catch (_) {}
    })();
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="system-nav" aria-label="工具導覽">
    <div class="system-nav-inner">
      <a href="index.html" class="system-brand">SEED Portal</a>
      <span class="system-nav-label">AI 查詢 · 詳情</span>
    </div>
  </nav>

  <header class="header">
    <div class="header-inner">
      <a href="query.html" class="logo logo-link">
        <span class="logo-icon">✦</span>
        <div>
          <h1>AI 查詢</h1>
          <p class="tagline">素材詳情 · 採集進你的知識書</p>
        </div>
      </a>
      <button type="button" id="theme-toggle" class="theme-toggle" aria-label="切換背景" title="切換背景">🌙</button>
    </div>
  </header>

  <main class="main tool-page">
    <a href="query.html" class="back-link">← 返回搜尋</a>
    <div id="tool-header" class="tool-page-header"></div>
    <div id="tool-content" class="tool-page-content markdown-body"></div>
    <div id="tool-error" class="empty-state" hidden>
      <h2>找不到此工具</h2>
      <p><a href="query.html">返回搜尋</a></p>
    </div>
  </main>

  <footer class="footer">
    <p>資料僅供參考 · 以官方網站為準</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="data.js"></script>
  <script src="shared.js"></script>
  <script src="tool.js"></script>
</body>
</html>
